name: Deploy Backend (SSH)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "backend/**"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            cd "${{ secrets.DEPLOY_PATH }}"
            cd backend
            $COMPOSE ps
            $COMPOSE up -d --no-deps --build api
            $COMPOSE logs --tail=120 api

            if curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8081/health >/dev/null
              curl -fsS http://127.0.0.1:8081/health/db >/dev/null
            else
              curl -fsS http://127.0.0.1:8080/health >/dev/null
              curl -fsS http://127.0.0.1:8080/health/db >/dev/null
            fi
